<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="斜面上物块的受力分析图">
  <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- 斜面 -->
    <path d="M20 170 L300 170 L300 40 Z" />
    <!-- 倾角标注 -->
    <path d="M60 170 A40 40 0 0 0 55 152" stroke-width="1.4" />
    <!-- 物块 -->
    <rect x="196" y="96" width="34" height="26" transform="rotate(-24.5 213 109)" />
  </g>
  <g stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round">
    <!-- 重力 -->
    <path d="M213 109 L213 155" />
    <path d="M213 155 L208 147 M213 155 L218 147" />
    <!-- 支持力 -->
    <path d="M213 109 L186 79" />
    <path d="M186 79 L188 88 M186 79 L195 81" />
    <!-- 摩擦力（沿斜面向上） -->
    <path d="M213 109 L250 92" />
    <path d="M250 92 L242 92 M250 92 L246 99" />
  </g>
  <g font-family="Georgia, serif" font-size="13" fill="currentColor">
    <text x="218" y="164">mg</text>
    <text x="168" y="76">N</text>
    <text x="254" y="86">f</text>
    <text x="44" y="166">θ</text>
    <text x="140" y="188" font-size="11">物块沿斜面下滑</text>
  </g>
</svg>

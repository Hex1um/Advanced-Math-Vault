<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="均质细杆绕端点转动的示意图">
  <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <!-- 支点 -->
    <path d="M40 40 L40 60" stroke-width="4" />
    <path d="M28 62 L52 62" />
    <!-- 水平位置（虚线） -->
    <path d="M40 50 L280 50" stroke-dasharray="6 5" stroke-width="1.4" />
    <!-- 杆（转到与水平成 θ 的位置） -->
    <path d="M40 50 L246 128" stroke-width="5" />
    <!-- 角度弧 -->
    <path d="M92 50 A52 52 0 0 1 88 68" stroke-width="1.4" />
    <!-- 角速度方向 -->
    <path d="M258 118 A96 96 0 0 1 268 138" stroke-width="1.6" />
    <path d="M268 138 L262 131 M268 138 L273 129" />
    <!-- 重力作用点 -->
    <path d="M143 89 L143 130" stroke-dasharray="4 4" stroke-width="1.4" />
    <path d="M143 130 L138 122 M143 130 L148 122" />
  </g>
  <g font-family="Georgia, serif" font-size="13" fill="currentColor">
    <text x="52" y="34">O</text>
    <text x="96" y="66">θ</text>
    <text x="272" y="152">ω</text>
    <text x="148" y="146">mg</text>
    <text x="196" y="40" font-size="11">均质细杆，长 L，质量 m</text>
  </g>
</svg>

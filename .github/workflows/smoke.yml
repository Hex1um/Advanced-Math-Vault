name: smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install verification deps
        run: pip install sympy mpmath
      - name: Full-chain smoke test
        run: node tools/smoke.mjs
      - name: Verify integral answers
        run: python tools/verify_integrals.py
      - name: Check KaTeX rendering
        run: node tools/check-katex.mjs
      - name: Tag taxonomy migration is idempotent
        run: node tools/migrate-tags.mjs

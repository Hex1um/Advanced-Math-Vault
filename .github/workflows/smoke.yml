name: smoke

# 门禁：题库与后端的任何改动都要过这一关。
# 不装任何依赖（零依赖后端），所以跑得很快。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 冒烟 + 体检 + 公式（JSON / SQLite 双引擎）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 版本信息
        run: node -v && npm -v

      - name: 冒烟测试（JSON 引擎）
        run: npm test

      - name: 冒烟测试（SQLite 引擎）
        run: npm run test:sqlite

      - name: 存储层自测（导入 / 增量落盘 / 重载一致性）
        run: npm run check:store

      - name: 邮件通道自测（假 SMTP 服务器）
        run: npm run check:mail

      - name: .env 解析自测
        run: npm run check:env

      - name: 鲁棒性体检（无 db.json 时回退 batch 题库）
        run: npm run check:robust

      - name: 管理员一次性重置机制
        run: npm run check:ops

      - name: HTTP 安全边界（路径穿越 / TRUST_PROXY / 500 脱敏 / 限流桶上限）
        run: npm run check:http

      - name: Markdown 渲染与 XSS 链接白名单
        run: npm run check:md

      - name: 公式键盘状态机
        run: npm run check:mathkey

      - name: 数学等价判题引擎（半角公式 / 对数合并 / 不定积分差常数）
        run: npm run check:equiv

      - name: 公式定界符与环境闭合门禁（未闭合 $ / $$ / \left\right / \begin\end）
        run: npm run check:delims

      - name: 物理判题引擎（单位换算 / 量纲 / 容差 / 有效数字）
        run: npm run check:physics-equiv

      - name: 物理内容门禁（标签体系 / 配图安全 / 标准答案自检）
        run: npm run check:physics-gate

      - name: 生产模式启动检查（健康检查 + 不给陌生人发管理员）
        env:
          NODE_ENV: production
          PORT: '8931'
          DB_FILE: data/.ci-prod.json
          LLM_API_KEY: ''
          DEEPSEEK_API_KEY: ''
          NO_FREE: '1'
          NO_AUTO_RESTORE: '1'
        run: |
          node server.js > /tmp/prod.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT
          for i in $(seq 1 40); do
            if curl -fsS "http://127.0.0.1:8931/api/health" > /tmp/health.json; then break; fi
            sleep 0.5
          done
          cat /tmp/health.json
          node -e "const h=require('/tmp/health.json'); if(!h.ok||!h.version) process.exit(1); if(h.warnings===undefined) process.exit(1); console.log('health ok', h.version, 'engine', h.engine);"
          REG=$(curl -fsS -X POST "http://127.0.0.1:8931/api/auth/register" -H 'Content-Type: application/json' -d '{"name":"ci_probe_user","password":"abcdefgh1"}')
          echo "$REG"
          node -e "const j=JSON.parse(process.argv[1]); if(j.user && j.user.role==='admin') { console.error('生产模式给首个注册者发了管理员'); process.exit(1); } console.log('production register ok, role=', j.user && j.user.role);" "$REG"

  symbolic:
    name: 符号 / 数值校验（sympy + mpmath）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-verify.txt

      - name: 安装依赖（版本锁定，避免 numpy/sympy 上游变更导致误报）
        run: pip install --disable-pip-version-check -r requirements-verify.txt

      - name: 积分答案求导验证
        run: python tools/verify/verify_integrals.py

      - name: 极限答案数值验证
        run: python tools/verify/verify_limits.py

      - name: 物理量纲与单位校验（SymPy dimsys_SI）
        run: python tools/verify/verify_physics.py --file data/batch-physics-01.json

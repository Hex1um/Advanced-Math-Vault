name: pages

# GitHub Pages：优先由 Actions 从 public/ 构建 docs/，没有 SHARECODE secret 时
# 直接发布仓库里已提交的 docs/（保证不会因为缺 secret 而卡住发布）。
on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'docs/**'
      - 'tools/ops/build-pages.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 构建 docs/（有 SHARECODE secret 时从 public/ 重新生成）
        env:
          SHARECODE: ${{ secrets.SHARECODE }}
          API_BASE: ${{ vars.API_BASE || 'https://math-vault-10141.app.workbuddy.host' }}
        run: |
          if [ -n "$SHARECODE" ]; then
            node tools/ops/build-pages.mjs
            echo "已从 public/ 重新构建 docs/"
          else
            echo "::warning::未配置 SHARECODE secret，直接发布仓库里已提交的 docs/"
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

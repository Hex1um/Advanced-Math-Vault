name: pages

# GitHub Pages：从 public/ 重建 docs/ 后发布。
# 接口地址与 sharecode 沿用仓库里已提交的 docs/js/config.js（两者都是公开信息），
# 所以这里不需要任何 secret；要换后端就改 site 的 config 并提交。
on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'docs/**'
      - 'tools/ops/build-pages.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 构建 docs/
        run: node tools/ops/build-pages.mjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
